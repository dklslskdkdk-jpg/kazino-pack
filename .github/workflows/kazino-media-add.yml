name: Añadir multimedia y corazón a Kazino
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kazino-media-add.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-pack-kazino
  cancel-in-progress: false
jobs:
  publicar:
    if: github.repository == 'dklslskdkdk-jpg/kazino-pack' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Importar archivos originales y comprobar dependencias
        run: python3 .github/kazino-media-add/import.py
      - name: Aplicar icono de Minecraft
        run: python3 .github/kazino-media-add/icon.py
      - name: Publicar mods y descarga de Kazino
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mods
          git commit -m 'Kazino: multimedia, CreativeCore, TotemTung 1.5.1 e icono del corazón'
          PACK_COMMIT=$(git rev-parse HEAD)
          PACK_COMMIT="$PACK_COMMIT" node -e "const fs=require('fs'),p=require('./.github/scripts/publish-pack.cjs').build(process.cwd(),process.env.GITHUB_REPOSITORY,process.env.PACK_COMMIT);if(p.mods.length!==17)throw Error('Cantidad inesperada de mods');fs.writeFileSync('pack-auto.json',JSON.stringify(p,null,2)+'\n');"
          git add -- pack-auto.json
          git commit -m 'Publicar descarga verificada de los 17 mods de Kazino'
          git pull --rebase origin main
          git push origin HEAD:main
