name: Build Bluu Client 0.4.33
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-launcher.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test restored invited-player sessions and verified account cards
        run: node --test .github/launcher-src/players-test.cjs .github/launcher-src/friend-session-test.cjs
      - name: Test release mod sources
        run: node --test .github/launcher-src/release-mods-test.cjs
      - name: Test access decisions before any pack download
        run: node --test .github/launcher-src/access-test.cjs
      - name: Test instance access notice visibility and automatic installation
        run: node --test .github/launcher-src/instances-test.cjs
      - name: Test native Windows updater end to end
        run: node .github/launcher-src/windows-update-test.cjs
      - name: Build Windows launcher and draft release
        run: node .github/launcher-src/build.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
