name: Añadir Icons v1.14 a Kazino
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-icons-114.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-pack-kazino
  cancel-in-progress: false
jobs:
  importar:
    if: github.repository == 'dklslskdkdk-jpg/kazino-pack' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar e importar el ZIP original
        run: python3 .github/import-icons-114/import.py
      - name: Publicar recurso y manifiesto de Kazino
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- resourcepacks/Icons-v1.14.zip
          if ! git diff --cached --quiet; then git commit -m 'Añadir Icons v1.14 a Kazino'; fi
          PACK_COMMIT=$(git rev-parse HEAD)
          PACK_COMMIT="$PACK_COMMIT" node -e "const fs=require('fs'),p=require('./.github/scripts/publish-pack.cjs').build(process.cwd(),process.env.GITHUB_REPOSITORY,process.env.PACK_COMMIT);fs.writeFileSync('pack-auto.json',JSON.stringify(p,null,2)+'\n');"
          git add -- pack-auto.json
          if ! git diff --cached --quiet; then git commit -m 'Publicar descarga verificada de Icons para Kazino'; fi
          git pull --rebase origin main
          git push origin HEAD:main
