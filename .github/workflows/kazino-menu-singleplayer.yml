name: Kazino modo de pruebas ceeseme
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kazino-menu-singleplayer.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-pack-kazino
  cancel-in-progress: false
jobs:
  publicar:
    if: github.repository == 'dklslskdkdk-jpg/kazino-pack' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar parche binario verificado
        run: python3 .github/kazino-menu-singleplayer/apply.py
      - name: Publicar mod y actualizar descarga
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mods
          git commit -m 'Kazino 2.1.6: Un jugador para ceeseme'
          PACK_COMMIT=$(git rev-parse HEAD)
          PACK_COMMIT="$PACK_COMMIT" node -e "const fs=require('fs'),p=require('./.github/scripts/publish-pack.cjs').build(process.cwd(),process.env.GITHUB_REPOSITORY,process.env.PACK_COMMIT);fs.writeFileSync('pack-auto.json',JSON.stringify(p,null,2)+'\n');"
          git add -- pack-auto.json
          git commit -m 'Publicar modo de pruebas de Kazino'
          git pull --rebase origin main
          git push origin HEAD:main
