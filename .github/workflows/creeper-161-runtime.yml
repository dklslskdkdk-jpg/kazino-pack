name: Actualizar CreeperPastel a 1.6.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/creeper-161-runtime.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-pack-kazino
  cancel-in-progress: false
jobs:
  publicar:
    if: github.repository == 'dklslskdkdk-jpg/kazino-pack' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar e instalar CreeperPastel
        run: python3 .github/creeper-161-runtime/apply.py
      - name: Publicar mod y lista de descarga
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mods/CreeperPastel-Forge-1.20.1-1.6.0.jar mods/CreeperPastel-Forge-1.20.1-1.6.1.jar
          git commit -m 'Actualizar CreeperPastel a 1.6.1 sin fuentes de desarrollo'
          PACK_COMMIT=$(git rev-parse HEAD)
          PACK_COMMIT="$PACK_COMMIT" node -e "const fs=require('fs'),p=require('./.github/scripts/publish-pack.cjs').build(process.cwd(),process.env.GITHUB_REPOSITORY,process.env.PACK_COMMIT);fs.writeFileSync('pack-auto.json',JSON.stringify(p,null,2)+'\n');"
          git add -- pack-auto.json
          git commit -m 'Publicar descarga verificada de CreeperPastel 1.6.1'
          git pull --rebase origin main
          git push origin HEAD:main
