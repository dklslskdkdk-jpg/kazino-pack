name: Replace Kazino with approved uploaded mods
on:
  push:
    paths:
      - '.github/workflows/replace-kazino-mods.yml'
permissions:
  contents: write
concurrency:
  group: publicar-pack-kazino
  cancel-in-progress: false
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all archive hashes before changing Kazino
        run: python3 .github/kazino-import/import.py
      - name: Publish exact approved Kazino pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mods pack-settings.json
          git commit -m 'Replace Kazino mods with 11 uploaded and verified JARs'
          MOD_COMMIT=$(git rev-parse HEAD)
          MOD_COMMIT="$MOD_COMMIT" node -e "const fs=require('fs'),p=require('./.github/scripts/publish-pack.cjs').build(process.cwd(),process.env.GITHUB_REPOSITORY,process.env.MOD_COMMIT);if(p.mods.length!==11||p.forge!=='47.4.28')throw Error('Wrong pack');fs.writeFileSync('pack-auto.json',JSON.stringify(p,null,2)+'\n');console.log('PASS 11 Kazino mods at Forge 47.4.28');"
          git add -- pack-auto.json
          git commit -m 'Publish verified Kazino manifest with exact hashes'
          git pull --rebase origin main
          git push origin HEAD:main
